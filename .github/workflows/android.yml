# Construit l'APK Android de Zoera sur un runner x86_64.
#
# Pourquoi ici : le développement se fait sur Termux/ARM, où ni le SDK Android
# ni un JDK complet ne peuvent produire un APK. Le runner `ubuntu-latest`
# fournit les deux.
#
# Déclencheurs :
#   • manuel (Actions → « Android APK » → Run workflow)  → APK debug
#   • tag `v1.2.3`                                        → APK release signée + Release GitHub
#
# Réglage requis : dépôt → Settings → Secrets and variables → Actions
#   Variables : ZOERA_APP_URL = https://ton-domaine.tld   (obligatoire)
#   Secrets   : ZOERA_KEYSTORE_BASE64, ZOERA_KEYSTORE_PASSWORD,
#               ZOERA_KEY_ALIAS, ZOERA_KEY_PASSWORD        (uniquement pour signer)
# Voir docs/MOBILE.md.

name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL HTTPS du serveur Zoera (vide = variable ZOERA_APP_URL)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # build-tools installés ci-dessous ; apksigner vit dans ce dossier.
  BUILD_TOOLS: "36.0.0"

jobs:
  apk:
    name: APK ${{ startsWith(github.ref, 'refs/tags/v') && 'release signée' || 'debug' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          # Le défaut de l'action est « tools platform-tools », or le paquet
          # « tools » n'existe plus dans le dépôt SDK (remplacé par
          # cmdline-tools) : sdkmanager échoue avec « Failed to find package
          # 'tools' ». On n'installe que platform-tools, le reste suit.
          packages: "platform-tools"

      - name: Installer la plateforme et les build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;${BUILD_TOOLS}"

      - name: Installer les dépendances
        run: npm ci

      - name: Résoudre l'URL du serveur
        # L'APK charge le site : sans URL HTTPS valide, elle afficherait la page
        # d'erreur embarquée. On échoue tôt plutôt que de livrer un APK inerte.
        env:
          INPUT_URL: ${{ github.event.inputs.app_url }}
          VAR_URL: ${{ vars.ZOERA_APP_URL }}
        run: |
          URL="${INPUT_URL:-$VAR_URL}"
          if [ -z "$URL" ]; then
            echo "::error::Aucune URL fournie. Définis la variable de dépôt ZOERA_APP_URL (Settings → Secrets and variables → Actions → Variables) ou passe app_url au lancement manuel."
            exit 1
          fi
          case "$URL" in
            https://*) ;;
            *)
              echo "::error::ZOERA_APP_URL doit commencer par https:// (Android bloque le HTTP en clair : $URL)"
              exit 1
              ;;
          esac
          echo "Cible : $URL"
          echo "ZOERA_APP_URL=$URL" >> "$GITHUB_ENV"

      - name: Synchroniser le projet Capacitor
        run: npx cap sync android

      - name: Compiler l'APK debug
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Versionner l'APK depuis le tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VERSION}\"/" android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Compiler l'APK release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Signer l'APK release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ZOERA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZOERA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZOERA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZOERA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Tag de release sans keystore. Ajoute les secrets ZOERA_KEYSTORE_* (voir docs/MOBILE.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zoera.jks"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" sign \
            --ks "$RUNNER_TEMP/zoera.jks" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "zoera-${GITHUB_REF_NAME}.apk" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f "$RUNNER_TEMP/zoera.jks"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --print-certs "zoera-${GITHUB_REF_NAME}.apk"

      - name: Publier l'APK debug
        uses: actions/upload-artifact@v4
        with:
          name: zoera-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier l'APK release signée
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: zoera-release-${{ github.ref_name }}
          path: zoera-${{ github.ref_name }}.apk
          if-no-files-found: error

      - name: Créer la Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: zoera-${{ github.ref_name }}.apk
          generate_release_notes: true
          body: |
            APK Zoera ${{ github.ref_name }} — construite pour `${{ env.ZOERA_APP_URL }}`.

            Installation : télécharger le fichier, autoriser « Installer des
            applications inconnues » pour le navigateur ou le gestionnaire de
            fichiers, puis ouvrir l'APK.
